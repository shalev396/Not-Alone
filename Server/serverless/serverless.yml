# Deploy: set EMAIL_SENDER_SECRET (and AWS_REGION for target region). npm run deploy
service: not-alone-email-sender
frameworkVersion: ^4.0.0
useDotenv: true

build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  memorySize: 256
  timeout: 30
  environment:
    EMAIL_SENDER_SECRET: ${env:EMAIL_SENDER_SECRET}
  httpApi:
    payload: "2.0"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "arn:aws:ses:${self:provider.region}:*:identity/*"

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: true
    target: node22
    platform: node
    format: cjs

functions:
  sendEmail:
    handler: src/handler.handler
    events:
      - httpApi:
          path: /send
          method: post

# SES: creates domain identity + Easy DKIM. You must publish the 3 DKIM CNAMEs in DNS (see stack Outputs
# or SES console) before the domain shows Verified. Sending from authenticator@<domain> then works.
# If this domain already exists in SES, remove it first or skip this resource to avoid AlreadyExists.
resources:
  Resources:
    SesSenderDomain:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: notalonesoldier.shalev396.com
        DkimSigningAttributes:
          NextSigningKeyLength: RSA_2048_BIT
  Outputs:
    SesDomain:
      Description: Domain identity in SES (verify via DKIM DNS records below)
      Value: notalonesoldier.shalev396.com
    DkimCname1:
      Description: CNAME name -> value (repeat for 2 and 3)
      Value:
        Fn::Join:
          - ""
          - - "Name="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenName1
            - " Value="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenValue1
    DkimCname2:
      Value:
        Fn::Join:
          - ""
          - - "Name="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenName2
            - " Value="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenValue2
    DkimCname3:
      Value:
        Fn::Join:
          - ""
          - - "Name="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenName3
            - " Value="
            - Fn::GetAtt:
                - SesSenderDomain
                - DkimDNSTokenValue3
