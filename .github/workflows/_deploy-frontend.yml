# Build client with APP_ENV_PROD → client/.env.production, deploy dist to S3, invalidate CloudFront (OIDC).
#
# Repository secrets (you choose secret vs variable per item; typical below):
#   APP_ENV_PROD     — multiline full env for production (anything Vite/build reads from .env.production)
#   AWS_ACCOUNT_ID   — for role ARN (OIDC)
#
# Repository variables (typical):
#   AWS_REGION, AWS_S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#
# IAM: role my-github-actions-role trusted for GitHub OIDC with s3:PutObject on bucket + cloudfront:CreateInvalidation
name: Deploy Frontend

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Load environment variables from APP_ENV_PROD
        run: |
          echo '${{ secrets.APP_ENV_PROD }}' > .env.production
        working-directory: client
      - name: Export .env variables
        uses: falti/dotenv-action@v1.1.4
        with:
          path: client/.env.production
          export-variables: true
          keys-case: bypass
          mask-variables: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/my-github-actions-role
      - name: Sync to S3
        run: aws s3 sync ./client/dist "s3://${AWS_S3_BUCKET}/" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
