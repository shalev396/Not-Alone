# Build client with APP_ENV_PROD → client/.env.production, deploy dist to S3, invalidate CloudFront (OIDC).
#
# Repository secrets (you choose secret vs variable per item; typical below):
#   APP_ENV_PROD     — multiline full env for production (anything Vite/build reads from .env.production)
#   AWS_ACCOUNT_ID   — for role ARN (OIDC)
#
# Repository variables (typical):
#   AWS_REGION, AWS_S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#
# IAM: role my-github-actions-role trusted for GitHub OIDC with s3:PutObject on bucket + cloudfront:CreateInvalidation
name: Deploy Frontend

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require APP_ENV_PROD
        env:
          APP_ENV_PROD: ${{ secrets.APP_ENV_PROD }}
        run: |
          if [ -z "$APP_ENV_PROD" ]; then
            echo "::error::Add repository secret APP_ENV_PROD (full multiline production env)"
            exit 1
          fi
      - name: Write client/.env.production from APP_ENV_PROD
        env:
          APP_ENV_PROD: ${{ secrets.APP_ENV_PROD }}
        run: |
          python3 -c "import os, pathlib; pathlib.Path('client/.env.production').write_text(os.environ.get('APP_ENV_PROD',''), encoding='utf-8')"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/my-github-actions-role
      - name: Sync to S3
        run: aws s3 sync ./client/dist "s3://${AWS_S3_BUCKET}/" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
