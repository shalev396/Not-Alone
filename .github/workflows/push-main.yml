# Push to main: deploy backend (Serverless) + frontend (S3/CloudFront) to prod
# Render auto-deploys separately via its own git hook
name: Push Main

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      stage: prod
