# Reusable workflow: Backend tests (Jest) against local dev server
name: Test Backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: "3001"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PASSWORD_KEY: ${{ secrets.PASSWORD_KEY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
      DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install
        working-directory: Server
      - name: Start API (npm run dev) and run Jest
        working-directory: Server
        run: |
          npm run dev &
          echo $! > /tmp/not-alone-api.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 "http://localhost:${PORT}/api/cities" 2>/dev/null || echo "000")
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "API responded on port ${PORT} (HTTP ${code})"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::API did not become ready in time"
              kill "$(cat /tmp/not-alone-api.pid)" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          npm test
          test_exit=$?
          kill "$(cat /tmp/not-alone-api.pid)" 2>/dev/null || true
          wait "$(cat /tmp/not-alone-api.pid)" 2>/dev/null || true
          exit $test_exit
      - name: Upload Jest HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jest-report
          path: Server/test-report.html
          retention-days: 7
