# Reusable workflow: lint + build client and Server (no env secrets required).
# Git path: Server/
name: Lint & Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-build-client:
    name: Lint & Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Lint client
        run: npm run lint
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client

  lint-build-server:
    name: Lint & Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Server dependencies
        run: npm ci
        working-directory: Server
      - name: Lint Server
        run: npm run lint
        working-directory: Server
      - name: Build Server
        run: npm run build
        working-directory: Server
