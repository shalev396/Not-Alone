# Reusable workflow: build client and server (no env secrets required)
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install client dependencies
        run: npm install
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install
        working-directory: Server
      - name: Build server
        run: npm run build
        working-directory: Server
