# Frontend E2E: APP_ENV_TEST → Server/.env (local API, same as backend test stack).
# APP_ENV_PROD → client/.env.production + client/test/.env.ci (same blob as deploy build; Vite runs with --mode production).
# Selenium/API URLs: client/test/src/e2e_targets.py (local only).
name: Test Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend Tests (pytest / Selenium + Vite)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PORT: "3000"
      BASE_URL: http://localhost:5173
      API_ROOT: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/test/requirements.txt
      - name: Write Server/.env from APP_ENV_TEST
        env:
          APP_ENV_TEST: ${{ secrets.APP_ENV_TEST }}
        run: |
          if [ -z "$APP_ENV_TEST" ]; then
            echo "::error::Add repository secret APP_ENV_TEST (full multiline env for tests)"
            exit 1
          fi
          python3 -c "import os, pathlib; pathlib.Path('Server/.env').write_text(os.environ.get('APP_ENV_TEST',''), encoding='utf-8')"
      - name: Write client/.env.production and client/test/.env.ci from APP_ENV_PROD
        env:
          APP_ENV_PROD: ${{ secrets.APP_ENV_PROD }}
        run: |
          if [ -z "$APP_ENV_PROD" ]; then
            echo "::error::Add repository secret APP_ENV_PROD (same multiline production env as deploy)"
            exit 1
          fi
          python3 -c "import os, pathlib; t=os.environ.get('APP_ENV_PROD',''); pathlib.Path('client/.env.production').write_text(t, encoding='utf-8'); pathlib.Path('client/test').mkdir(parents=True, exist_ok=True); pathlib.Path('client/test/.env.ci').write_text(t, encoding='utf-8')"
      - name: Install Server dependencies
        run: npm ci
        working-directory: Server
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome.deb
      - name: Install E2E Python venv and dependencies
        run: npx tsx test/scripts/run-e2e.ts install
        working-directory: client
      - name: Start backend and frontend, wait, run E2E
        run: |
          set -e
          cd Server
          npm run dev &
          cd ../client
          npm run dev -- --host localhost --port 5173 --mode production &
          cd ..
          sleep 30
          cd client
          npx tsx test/scripts/run-e2e.ts headless
