# Reusable workflow: Frontend E2E tests (pytest / Selenium + Vite) against local servers
name: Test Frontend

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  test-frontend:
    name: Frontend Tests (pytest / Selenium + Vite)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PORT: "3000"
      BASE_URL: http://localhost:5173
      API_ROOT: http://localhost:3000/api
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PASSWORD_KEY: ${{ secrets.PASSWORD_KEY }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      # The E2E backend runs without NODE_ENV=test, so it reads DATABASE_URL: point it at qa
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # MongoDB Atlas IAM auth (MONGODB-AWS): the CI role is an Atlas database user
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/my-github-actions-role
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/test/requirements.txt
      - name: Install server dependencies
        run: npm install
        working-directory: Server
      - name: Install client dependencies
        run: npm install
        working-directory: client
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome.deb
      - name: Install E2E Python venv and dependencies
        run: npx tsx test/scripts/run-e2e.ts install
        working-directory: client
      - name: Seed E2E data (admin user, clear signup user)
        run: npx ts-node tests/e2eSeed.ts
        working-directory: Server
      - name: Start backend and frontend, wait, run E2E
        run: |
          set -e
          cd Server
          npm run dev &
          cd ../client
          npm run dev -- --host localhost --port 5173 --mode production &
          cd ..
          sleep 30
          cd client
          npx tsx test/scripts/run-e2e.ts headless
