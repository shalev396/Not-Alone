# Frontend E2E: after client npm ci, write Server/.env from secret APP_ENV_PROD (same multiline blob as local server/.env).
# Client has no separate env file in CI (localhost API + client/test/src/e2e_targets.py). Runs after test-backend (pr-main.yml).
name: Test Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend Tests (pytest / Selenium + Vite)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PORT: "3000"
      BASE_URL: http://localhost:5173
      API_ROOT: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/test/requirements.txt
      - name: Install Server dependencies
        run: npm ci
        working-directory: Server
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Load environment variables from APP_ENV_PROD
        run: |
          echo '${{ secrets.APP_ENV_PROD }}' > .env
        working-directory: Server
      - name: Export .env variables
        uses: falti/dotenv-action@v1.1.4
        with:
          path: Server/.env
          export-variables: true
          keys-case: bypass
          mask-variables: true
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome.deb
      - name: Install E2E Python venv and dependencies
        run: npx tsx test/scripts/run-e2e.ts install
        working-directory: client
      - name: Start backend and frontend, wait, run E2E
        run: |
          set -e
          cd Server
          npm run dev &
          cd ../client
          npm run dev -- --host localhost --port 5173 --mode production &
          cd ..
          sleep 30
          cd client
          npx tsx test/scripts/run-e2e.ts headless
