# Reusable workflow: Frontend E2E tests (pytest / Selenium + Vite) against local servers
name: Test Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend Tests (pytest / Selenium + Vite)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PORT: "3001"
      BASE_URL: http://localhost:5173
      API_ROOT: http://localhost:3001/api
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PASSWORD_KEY: ${{ secrets.PASSWORD_KEY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
      DEVICE_TOKEN_SECRET: ${{ secrets.DEVICE_TOKEN_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/test/requirements.txt
      - name: Install server dependencies
        run: npm install
        working-directory: server
      - name: Install client dependencies
        run: npm install
        working-directory: client
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome.deb
      - name: Install E2E Python venv and dependencies
        run: npx tsx test/scripts/run-e2e.ts install
        working-directory: client
      - name: Start backend and frontend, wait, run E2E
        run: |
          set -e
          cd server
          npm run dev &
          cd ../client
          npm run dev -- --host localhost --port 5173 --mode production &
          cd ..
          sleep 30
          cd client
          npx tsx test/scripts/run-e2e.ts headless
