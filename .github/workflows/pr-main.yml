# PR to main: build, backend tests, frontend tests.
# Secrets: APP_ENV_TEST (Server/.env in backend + frontend E2E API), APP_ENV_PROD (client production env for frontend E2E, same as deploy).
name: PR to Main

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "Server/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  test-backend:
    name: Test Backend
    needs: build
    uses: ./.github/workflows/_test-backend.yml
    secrets: inherit

  test-frontend:
    name: Test Frontend
    needs: build
    uses: ./.github/workflows/_test-frontend.yml
    secrets: inherit
