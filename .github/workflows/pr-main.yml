# PR to main: build → backend tests (APP_ENV_TEST → Server/.env) → frontend E2E (APP_ENV_PROD → Server/.env after client install).
# APP_ENV_PROD: same multiline server/.env you use locally (also used by deploy-frontend for client/.env.production if present).
name: PR to Main

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "Server/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  test-backend:
    name: Test Backend
    needs: build
    uses: ./.github/workflows/_test-backend.yml
    secrets: inherit

  test-frontend:
    name: Test Frontend
    needs: [build, test-backend]
    uses: ./.github/workflows/_test-frontend.yml
    secrets: inherit
