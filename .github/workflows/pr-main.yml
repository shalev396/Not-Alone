# PR to main: build -> backend tests -> frontend E2E
name: PR to Main

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "Server/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  test-backend:
    name: Test Backend
    needs: build
    uses: ./.github/workflows/_test-backend.yml
    secrets: inherit

  test-frontend:
    name: Test Frontend
    needs: [build, test-backend]
    uses: ./.github/workflows/_test-frontend.yml
    secrets: inherit
